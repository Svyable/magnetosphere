name: Publish public Magnetosphere to GitHub Pages
on:
  workflow_dispatch:
  pull_request:
    paths:
      - vite.config.ts
      - src/router.tsx
      - src/routes/**
      - src/components/mag/**
      - .github/workflows/publish-pages.yml
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - package.json
      - bun.lock
      - vite.config.ts
      - .github/workflows/publish-pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: magnetosphere-pages
  cancel-in-progress: false
jobs:
  build:
    name: Build static 3D observatory at /magnetosphere/
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Build GitHub Pages SPA (Lovable config remains untouched)
        env:
          GITHUB_PAGES: "1"
        run: bun run build
      - name: Inspect generated static entry and assets
        run: |
          find .output/public -maxdepth 2 -type f | head -30
          if [ ! -f .output/public/index.html ] && [ -f .output/public/magnetosphere/index.html ]; then
            cp .output/public/magnetosphere/index.html .output/public/index.html
          fi
          test -s .output/public/index.html
          test -f .output/public/textures/earth_atmos_2048.jpg
          test -f .output/public/textures/earth_lights_2048.png
          touch .output/public/.nojekyll
          cp .output/public/index.html .output/public/404.html
      - name: Upload static public files for review/deploy
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public
  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
