name: Public space-weather source audit
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - scripts/audit-public-feeds.ts
      - src/lib/space/feed-audit.ts
      - .github/workflows/feed-health.yml
permissions:
  contents: read
jobs:
  external-feeds:
    name: Check NOAA and NASA from Actions runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Query public feeds and timestamp/report
        run: bun scripts/audit-public-feeds.ts
      - name: Publish diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-feed-audit
          path: artifacts/feed-health/
          if-no-files-found: warn
          retention-days: 14
