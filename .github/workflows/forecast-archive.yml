name: Archive issued forecasts (verification record)
# NOAA's rolling forecast products overwrite themselves. This job keeps every issued version,
# observed Kp to verify against, and a CORS-free copy of NASA CCMC's CME Scoreboard on the
# `forecast-archive` branch (never on main). See scripts/archive-forecasts.ts.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/archive-forecasts.ts
      - src/lib/space/ccmc.ts
      - src/lib/space/enlil.ts
      - src/lib/space/ops.ts
      - src/lib/space/forecast.ts
      - .github/workflows/forecast-archive.yml
permissions:
  contents: read
concurrency:
  group: forecast-archive
  cancel-in-progress: false
jobs:
  dry-run:
    name: Dry run against live NOAA/CCMC (read-only, no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Fetch every product into a scratch directory
        run: bun scripts/archive-forecasts.ts "$RUNNER_TEMP/archive-dry-run"
      - name: Summary
        if: always()
        run: |
          f="$RUNNER_TEMP/archive-dry-run/latest/manifest.json"
          if [ -f "$f" ]; then { echo '### Forecast archive dry run (nothing pushed)'; echo '```json'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

  archive:
    name: Snapshot issued NOAA products, Enlil and CCMC CME predictions
    if: github.repository == 'Svyable/magnetosphere' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Check out or create the archive branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" forecast-archive >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch forecast-archive "$url" archive
          else
            mkdir archive && cd archive && git init --quiet -b forecast-archive && git remote add origin "$url"
          fi
      - name: Fetch and archive products
        run: bun scripts/archive-forecasts.ts archive
      - name: Commit and push (archive branch only)
        run: |
          set -euo pipefail
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No new forecast versions."; exit 0; fi
          git commit --quiet -m "archive: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet origin forecast-archive
      - name: Summary
        if: always()
        run: |
          if [ -f archive/latest/manifest.json ]; then
            { echo '### Forecast archive'; echo '```json'; cat archive/latest/manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
